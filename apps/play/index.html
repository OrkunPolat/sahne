<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1020" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Sahne</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var themes = ["midnight-gold", "obsidian-neon", "cream-forest", "burgundy-champagne"];
        var colors = { "midnight-gold": "#0B1020", "obsidian-neon": "#07080C", "cream-forest": "#F4EFE6", "burgundy-champagne": "#2A0F16" };
        var t = "midnight-gold";
        try { var s = localStorage.getItem("sahne.theme"); if (s && themes.indexOf(s) >= 0) t = s; } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", colors[t]);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
